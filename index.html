<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY ZALIM - Free Fire Pro Panel</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #ef4444;
        }
        h2 {
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section {
            background: #334155;
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }
        .section h4 {
            margin: 0 0 8px 0;
            color: #38bdf8;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #ef4444;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #dc2626;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Zalimax Pro Panel</h2>
        <p>Welcome to ZALIM ARMY Hub</p>

        <div class="section">
            <h4>Player Identification</h4>
            <label>Enter Free Fire UID:</label>
            <input type="text" id="uid" placeholder="Example: 123456789">
        </div>

        <div class="section">
            <h4>Pro Sensitivity Settings</h4>
            <label>General Sensitivity:</label>
            <input type="text" value="95 - 99" readonly>
            
            <label>Red Dot Scope:</label>
            <input type="text" value="92 - 96" readonly>
            
            <label>2x / 4x Scope:</label>
            <input type="text" value="88 - 94" readonly>
        </div>

        <div class="section">
            <h4>Performance & Boost</h4>
            <label>Select Boost Mode:</label>
            <select id="boostMode">
                <option>Headshot Rate Booster (High)</option>
                <option>FPS Extreme Stabilizer</option>
                <option>Anti-Lag Touch Response</option>
            </select>
        </div>

        <button onclick="activatePanel()">ACTIVATE PANEL</button>

        <div class="status" id="statusText"></div>
    </div>

    <script>
        function activatePanel() {
            var uid = document.getElementById('uid').value;
            var status = document.getElementById('statusText');
            if(uid === "") {
                status.style.color = "#f87171";
                status.innerHTML = "⚠️ कृपया पहले अपना UID दर्ज करें!";
            } else {
                status.style.color = "#4ade80";
                status.innerHTML = "🚀 ZALIM ARMY Boost Activated Successfully!";
            }
        }
    </script>

</body>
</html>
